<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEAE3"/>
      <stop offset="100%" stop-color="#E4E0D6"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#ground)"/>
  <text x="992" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="400" fill="#8A8578" text-anchor="end">1 / 8</text>
  <line x1="88" y1="138" x2="134" y2="138" stroke="#8A8578" stroke-width="3"/>
  <text x="154" y="148" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="700" fill="#8A8578" letter-spacing="6">THE 2026 SKILL SHIFT</text>
  <text x="88" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="900" fill="#1A1A18">You used to</text>
  <text x="88" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="900" fill="#1A1A18">lay bricks.</text>
  <rect x="700" y="400" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="790" y="400" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="880" y="400" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="658" y="350" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="748" y="350" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="838" y="350" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="700" y="300" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="790" y="300" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="880" y="300" width="84" height="44" fill="none" rx="3" stroke="#D2CEC4" stroke-width="3"/>
  <rect x="880" y="300" width="84" height="44" fill="#E14B16" rx="3" opacity="0.9"/>
  <rect x="78" y="566" width="830" height="74" fill="#F6C9A8" rx="4" opacity="0.95"/>
  <text x="88" y="624" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#1A1A18">Now a robot lays them faster.</text>
  <rect x="88" y="712" width="6" height="200" fill="#E14B16" rx="3"/>
  <text x="122" y="752" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#8A8578">Your value was never the bricklaying.</text>
  <text x="122" y="836" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="900" fill="#1A1A18">It was deciding</text>
  <text x="122" y="906" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="900" fill="#E14B16">where the wall goes.</text>
  <line x1="88" y1="1024" x2="992" y2="1024" stroke="#D2CEC4" stroke-width="2"/>
  <text x="88" y="1078" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A18">Andrew Ng analyzed 10,000 job postings.</text>
  <text x="88" y="1120" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1A1A18">Four skills came back. Coding was not one of them.</text>
  <line x1="88" y1="1196" x2="992" y2="1196" stroke="#D2CEC4" stroke-width="2"/>
  <text x="88" y="1248" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1A1A18">Altaf Shaikh</text>
  <text x="88" y="1282" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="400" fill="#8A8578">// AI Engineering</text>
  <text x="946" y="1244" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#E14B16" text-anchor="end">@teachmebro</text>
  <text x="946" y="1278" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">Coding is the floor now,</text>
  <text x="946" y="1302" font-family="'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#8A8578" text-anchor="end">not the ceiling.</text>
  <circle cx="966" cy="1236" r="11" fill="#E14B16"/>
  <circle cx="990" cy="1236" r="11" fill="#1668D6"/>
</svg>

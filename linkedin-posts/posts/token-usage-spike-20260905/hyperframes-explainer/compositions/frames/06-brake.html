    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.2s): kicker + headline fade up; empty tracks set the stage
        tl.fromTo("#brake-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.0);
        tl.fromTo("#brake-headline", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.15);
        tl.fromTo(["#brake-track-a", "#brake-track-b"], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out", stagger: 0.1 }, 0.3);
        tl.fromTo(["#brake-fill-a", "#brake-fill-b"], { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0.0);

        // Scene 2 (1.2-3.2s): row A fills to the marker, auto-compact fires, steps back to ~40%
        tl.fromTo("#brake-label-a", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.2);
        tl.fromTo("#brake-marker", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "power2.out" }, 1.3);
        tl.fromTo("#brake-fill-a", { scaleX: 0 }, { scaleX: 0.8, duration: 1.0, ease: "power2.out", immediateRender: false }, 1.35);
        tl.fromTo("#brake-marker-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.2);
        tl.fromTo("#brake-fill-a", { scaleX: 0.8 }, { scaleX: 0.4, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 2.55);

        // Scene 3 (3.2-4.8s): row B coral fill runs the whole track without stopping
        tl.fromTo("#brake-label-b", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 3.2);
        tl.fromTo("#brake-fill-b", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "power1.in", immediateRender: false }, 3.3);
        tl.fromTo("#brake-tag", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 4.35);

        // Scene 4 (4.8-6.0s): rule draws on, footer fades up, hold still
        tl.fromTo("#brake-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 4.8);
        tl.fromTo("#brake-footer", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.9);
        tl.set({}, {}, 6.0);

        window.__timelines["06-brake"] = tl;

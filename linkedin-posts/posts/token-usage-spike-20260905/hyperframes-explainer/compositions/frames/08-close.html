<template id="close08-template">
  <div id="root" data-composition-id="08-close" data-width="1080" data-height="1350" data-duration="5.5">
    <style>
      @font-face { font-family: "EB Garamond"; src: url("assets/fonts/EBGaramond-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      #root { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
      #close08-bg { position: absolute; inset: 0; background: #FAF9F5; }
      #close08-content { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; }
      /* Top band: line 1 starts near y 200 */
      #close08-line1 {
        position: absolute; left: 88px; top: 196px; width: 904px; margin: 0; text-align: center;
        font-family: "EB Garamond", Georgia, serif; font-weight: 400;
        font-size: 90px; line-height: 1.1; letter-spacing: -0.018em; color: #141413;
      }
      /* Middle band: line 2 is the display-italic hero */
      #close08-line2 {
        position: absolute; left: 80px; top: 480px; width: 920px; margin: 0; text-align: center;
        font-family: "EB Garamond", Georgia, serif; font-weight: 400; font-style: italic;
        font-size: 122px; line-height: 1.04; letter-spacing: -0.014em; color: #141413;
      }
      #close08-line2 .close08-accent { color: #CC785C; }
      /* Lower band: hairline rule + handle, above the 1120 keep-out */
      #close08-rule {
        position: absolute; left: 480px; top: 1030px; width: 120px; height: 1px;
        background: rgba(20,20,19,0.25);
      }
      #close08-handle {
        position: absolute; left: 0; top: 1056px; width: 1080px; margin: 0; text-align: center;
        font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 30px; line-height: 1.2;
        letter-spacing: 0.02em; color: rgba(20,20,19,0.72);
      }
    </style>

    <div id="close08-bg" class="clip" data-start="0" data-duration="5.5" data-track-index="0"></div>

    <div id="close08-content" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
      <p id="close08-line1">Open your longest session from this week.</p>
      <p id="close08-line2">Count how many API calls came out of <span class="close08-accent">one message</span>.</p>
      <div id="close08-rule"></div>
      <p id="close08-handle">@teachmebro</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.4s): line 1 slides up + fades in, subtle scale settle
        tl.fromTo("#close08-line1",
          { opacity: 0, y: 40, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: "power3.out" }, 0.15);

        // Scene 2 (1.4-2.8s): line 2 (hero) slides up beneath, coral accent settles
        tl.fromTo("#close08-line2",
          { opacity: 0, y: 48 },
          { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 1.2);
        tl.fromTo("#close08-line2 .close08-accent",
          { opacity: 0.55 },
          { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.8);

        // Scene 3 (2.8-4.9s): hairline draws, handle fades in, then still hold
        tl.fromTo("#close08-rule",
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 2.3);
        tl.fromTo("#close08-handle",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 2.4);

        // Scene 4 (4.9-5.5s): final frame exit, content fades to the cream ground
        tl.fromTo("#close08-content",
          { opacity: 1 },
          { opacity: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 3.5);

        tl.set({}, {}, 4.0);

        window.__timelines["08-close"] = tl;
      })();
    </script>
  </div>
</template>
